<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Islamic Finance & Shariah Compliance News Hub</title>
<style>
:root{--green:#0b5d3b;--dark:#083f28;--gold:#c9a24b;--bg:#f5f6f4;--card:#fff;--text:#1c2a22;--muted:#5b6b62;--border:#e2e6e0}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,var(--dark),var(--green));color:#fff;padding:22px 28px}header h1{margin:0;font-size:22px}header p{margin:6px 0 0;color:#dfeee6;font-size:13px}
nav{display:flex;gap:8px;background:var(--dark);padding:0 28px;flex-wrap:wrap}.mode{padding:12px 18px;color:#cfe4d8;font-size:14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent}.mode.active{color:#fff;border-bottom-color:var(--gold)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;padding:14px 28px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}.toolbar input{flex:1;min-width:210px;padding:9px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px}.toolbar select{padding:9px 12px;border:1px solid var(--border);border-radius:6px;background:#fff}.toolbar button{border:0;border-radius:6px;padding:9px 16px;background:var(--gold);color:#3a2e00;font-weight:700;cursor:pointer}.toolbar button:disabled{opacity:.65}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 28px 0}.chip{padding:7px 14px;border-radius:20px;background:#eef1ec;border:1px solid var(--border);font-size:13px;color:var(--muted);cursor:pointer}.chip.active{background:var(--green);color:#fff;border-color:var(--green)}
main{padding:18px 28px 40px;max-width:1200px;margin:auto}.intro,.status{font-size:13px;color:var(--muted)}.status{font-size:12px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}.meta{display:flex;align-items:center;justify-content:space-between;gap:5px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}.badge{background:#eaf3ee;color:var(--dark);border-radius:12px;padding:2px 9px;font-weight:700}.country{background:#f7efe0;color:#8a6d1f;border-radius:12px;padding:2px 9px;font-weight:700}.title{color:var(--text);font-weight:650;font-size:15px;line-height:1.35;text-decoration:none}.title:hover{color:var(--green);text-decoration:underline}.desc{font-size:13px;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.source{color:#9a7629;font-size:12px;font-weight:700}.empty{text-align:center;padding:55px 10px;color:var(--muted)}
footer{max-width:1200px;margin:0 auto 35px;padding:15px 28px;border-top:1px solid var(--border);font-size:11.5px;color:#7b857e;text-align:center;line-height:1.6}.spinner{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-inline-end:6px}@keyframes spin{to{transform:rotate(360deg)}}
[dir="rtl"] .toolbar,[dir="rtl"] nav,[dir="rtl"] .tabs{text-align:right}[dir="rtl"] body{font-family:Tahoma,"Segoe UI",Arial,sans-serif}
@media(max-width:600px){header,.toolbar,main{padding-left:16px;padding-right:16px}nav,.tabs{padding-left:16px;padding-right:16px}.mode{padding:10px 9px;font-size:13px}}
</style>
</head>
<body>
<header><h1 id="title"></h1><p id="subtitle"></p></header>
<nav id="modeNav"></nav>
<div class="toolbar">
  <input id="search" type="text">
  <select id="language" aria-label="Language"><option value="en">English</option><option value="ar">العربية</option><option value="ur">اردو</option></select>
  <button id="refresh" type="button"></button>
</div>
<div class="tabs" id="tabs"></div>
<main><p class="intro" id="intro"></p><p class="status" id="status"></p><div class="grid" id="grid"></div></main>
<footer id="footer"></footer>
<script>
const I18N={
 en:{title:"🕌 Islamic Finance & Shariah Compliance News Hub",subtitle:"Live coverage of Islamic finance, business opportunities and careers.",news:"📰 News",business:"🤝 Business Opportunities",careers:"💼 Careers",search:"Search headlines, jobs, or opportunities...",refresh:"⟳ Refresh",refreshing:"Refreshing...",all:"All",introNews:"Islamic finance, Sukuk, Takaful and Shariah compliance news published within the last 3 days.",introBusiness:"Business, trade, distribution and manufacturing opportunities published within the last 3 days.",introCareers:"Islamic banking, finance, Takaful and Shariah roles posted within the last 2 months. Please confirm closing status with the original source.",loading:"Fetching current results...",loaded:n=>`${n} current results · Updated ${new Date().toLocaleString()}`,partial:n=>`${n} current results loaded · Some sources were unavailable`,empty:"No current results match this selection.",footer:"This utility is provided for community benefit and non-commercial use. It aggregates public headlines and links to original sources. Availability and accuracy remain the responsibility of the original publishers. Created by Azf. Iqbal, through AI.",global:"Global",sukuk:"Sukuk",takaful:"Takaful",standards:"Shariah / Standards",contracts:"Contracts",pakistan:"Pakistan",gcc:"GCC",fintech:"Fintech",trade:"Trade & Export",distribution:"Distribution / FMCG",manufacturing:"Manufacturing",sme:"SME Financing",halal:"Halal Industry",policy:"Policy & Tenders",projects:"Project Financing",pk:"Pakistan",mideast:"Middle East / GCC",sea:"Southeast Asia",sa:"South Asia",uk:"UK & Europe",remote:"Global / Remote",job:"Open Position"},
 ar:{title:"🕌 مركز أخبار التمويل الإسلامي والالتزام الشرعي",subtitle:"تغطية مباشرة للتمويل الإسلامي وفرص الأعمال والوظائف.",news:"📰 الأخبار",business:"🤝 فرص الأعمال",careers:"💼 الوظائف",search:"ابحث في الأخبار والوظائف والفرص...",refresh:"⟳ تحديث",refreshing:"جارٍ التحديث...",all:"الكل",introNews:"أخبار التمويل الإسلامي والصكوك والتكافل والالتزام الشرعي المنشورة خلال آخر 3 أيام.",introBusiness:"فرص الأعمال والتجارة والتوزيع والتصنيع المنشورة خلال آخر 3 أيام.",introCareers:"وظائف التمويل والمصرفية الإسلامية والتكافل والشريعة المنشورة خلال آخر شهرين. يرجى تأكيد حالة الإغلاق من المصدر الأصلي.",loading:"جارٍ جلب النتائج الحالية...",loaded:n=>`${n} نتيجة حالية · تم التحديث ${new Date().toLocaleString("ar")}`,partial:n=>`تم تحميل ${n} نتيجة حالية · بعض المصادر غير متاحة`,empty:"لا توجد نتائج حالية مطابقة.",footer:"هذه الأداة مخصصة لخدمة المجتمع وللاستخدام غير التجاري. تجمع عناوين عامة وتربط بالمصادر الأصلية، وتبقى دقة المحتوى وتوفره مسؤولية الناشرين الأصليين. أُنشئت بواسطة Azf. Iqbal باستخدام الذكاء الاصطناعي.",global:"عالمي",sukuk:"الصكوك",takaful:"التكافل",standards:"الشريعة / المعايير",contracts:"العقود",pakistan:"باكستان",gcc:"دول الخليج",fintech:"التقنية المالية",trade:"التجارة والتصدير",distribution:"التوزيع والسلع الاستهلاكية",manufacturing:"التصنيع",sme:"تمويل المنشآت",halal:"صناعة الحلال",policy:"السياسات والمناقصات",projects:"تمويل المشاريع",pk:"باكستان",mideast:"الشرق الأوسط / الخليج",sea:"جنوب شرق آسيا",sa:"جنوب آسيا",uk:"المملكة المتحدة وأوروبا",remote:"عالمي / عن بُعد",job:"وظيفة شاغرة"},
 ur:{title:"🕌 اسلامی مالیات اور شرعی تعمیل نیوز ہب",subtitle:"اسلامی مالیات، کاروباری مواقع اور ملازمتوں کی تازہ معلومات۔",news:"📰 خبریں",business:"🤝 کاروباری مواقع",careers:"💼 ملازمتیں",search:"خبریں، ملازمتیں یا مواقع تلاش کریں...",refresh:"⟳ تازہ کریں",refreshing:"تازہ کیا جا رہا ہے...",all:"تمام",introNews:"گزشتہ 3 دن میں شائع ہونے والی اسلامی مالیات، صکوک، تکافل اور شرعی تعمیل کی خبریں۔",introBusiness:"گزشتہ 3 دن میں شائع ہونے والے کاروبار، تجارت، تقسیم اور مینوفیکچرنگ کے مواقع۔",introCareers:"گزشتہ 2 ماہ میں شائع ہونے والی اسلامی بینکاری، مالیات، تکافل اور شریعہ کی ملازمتیں۔ اختتامی حیثیت اصل ماخذ سے ضرور چیک کریں۔",loading:"موجودہ نتائج حاصل کیے جا رہے ہیں...",loaded:n=>`${n} موجودہ نتائج · تازہ کاری ${new Date().toLocaleString("ur-PK")}`,partial:n=>`${n} موجودہ نتائج لوڈ ہوئے · کچھ ذرائع دستیاب نہیں تھے`,empty:"اس انتخاب کے مطابق کوئی موجودہ نتیجہ نہیں ملا۔",footer:"یہ سہولت عوامی فائدے اور غیر تجارتی استعمال کے لیے ہے۔ یہ عوامی سرخیاں جمع کرتی اور اصل ماخذ سے منسلک کرتی ہے۔ مواد کی درستگی اور دستیابی کی ذمہ داری اصل ناشرین پر ہے۔ یہ سہولت Azf. Iqbal نے AI کے ذریعے تیار کی ہے۔",global:"عالمی",sukuk:"صکوک",takaful:"تکافل",standards:"شریعہ / معیارات",contracts:"عقود",pakistan:"پاکستان",gcc:"خلیجی ممالک",fintech:"فن ٹیک",trade:"تجارت و برآمدات",distribution:"تقسیم / ایف ایم سی جی",manufacturing:"مینوفیکچرنگ",sme:"ایس ایم ای فنانسنگ",halal:"حلال صنعت",policy:"پالیسی اور ٹینڈرز",projects:"پروجیکٹ فنانسنگ",pk:"پاکستان",mideast:"مشرق وسطیٰ / خلیج",sea:"جنوب مشرقی ایشیا",sa:"جنوبی ایشیا",uk:"برطانیہ و یورپ",remote:"عالمی / ریموٹ",job:"کھلی آسامی"}
};
const NEWS=[
 {k:"global",q:'"Islamic finance" OR "Islamic banking"'},{k:"sukuk",q:'Sukuk'},{k:"takaful",q:'Takaful insurance'},{k:"standards",q:'"Shariah compliant" OR AAOIFI OR IFSB'},{k:"contracts",q:'Murabaha OR Ijarah OR Musharakah OR Mudarabah'},{k:"pakistan",q:'Pakistan ("Islamic banking" OR Shariah OR Sukuk OR "State Bank of Pakistan")'},{k:"gcc",q:'("Islamic bank" OR Sukuk) (UAE OR Saudi OR Qatar OR Bahrain OR Kuwait)'},{k:"fintech",q:'"Islamic fintech" OR "digital Islamic banking"'}];
const BUSINESS=[
 {k:"trade",q:'Pakistan (exports OR "trade finance" OR "export incentive" OR "free trade agreement")'},{k:"distribution",q:'Pakistan ("distribution agreement" OR FMCG OR "sales network" OR "distributor appointed")'},{k:"manufacturing",q:'Pakistan (manufacturing OR "industrial expansion" OR "new factory" OR "production facility")'},{k:"sme",q:'("Islamic trade finance" OR "SME financing" OR Murabaha) (Pakistan OR SME OR exporters)'},{k:"gcc",q:'(GCC OR UAE OR Saudi OR Qatar) ("business opportunity" OR "trade delegation" OR "investment opportunity" OR "franchise opportunity")'},{k:"halal",q:'("Halal certification" OR "Halal export" OR "Halal industry") (Pakistan OR global OR expansion)'},{k:"policy",q:'Pakistan ("import policy" OR "export policy" OR tender OR "trade tariff" OR SECP OR "State Bank of Pakistan")'},{k:"projects",q:'Sukuk ("project financing" OR infrastructure OR industrial OR manufacturer)'}];
const REGIONS=[
 {k:"pk",host:"pk.indeed.com",loc:"Pakistan"},{k:"mideast",host:"ae.indeed.com",loc:"United Arab Emirates"},{k:"sea",host:"www.indeed.com",loc:"Malaysia"},{k:"sa",host:"www.indeed.com",loc:"Bangladesh"},{k:"uk",host:"uk.indeed.com",loc:"United Kingdom"},{k:"remote",host:"www.indeed.com",loc:"Remote"}];
const CAREER_Q="Islamic banking OR Islamic finance OR Shariah compliance OR Takaful OR Sukuk";
let lang=localStorage.getItem("ifnLang")||"en",mode="news",active="all",region="pk",data={news:[],business:[],careers:[]},failed=0;
const $=id=>document.getElementById(id), t=k=>I18N[lang][k]??k;
function applyLanguage(){document.documentElement.lang=lang;document.documentElement.dir=lang==="en"?"ltr":"rtl";$("title").textContent=t("title");$("subtitle").textContent=t("subtitle");$("search").placeholder=t("search");$("refresh").textContent=t("refresh");$("footer").textContent=t("footer");$("language").value=lang;buildNav();buildTabs();updateIntro();render()}
function buildNav(){const labels={news:t("news"),business:t("business"),careers:t("careers")};$("modeNav").innerHTML=["news","business","careers"].map(k=>`<div class="mode ${mode===k?"active":""}" data-mode="${k}">${labels[k]}</div>`).join("");document.querySelectorAll(".mode").forEach(x=>x.onclick=()=>switchMode(x.dataset.mode))}
function buildTabs(){const src=mode==="news"?NEWS:mode==="business"?BUSINESS:REGIONS;$("tabs").innerHTML=(mode==="careers"?src.map(x=>`<div class="chip ${region===x.k?"active":""}" data-k="${x.k}">${t(x.k)}</div>`):[{k:"all"},...src].map(x=>`<div class="chip ${active===x.k?"active":""}" data-k="${x.k}">${x.k==="all"?t("all"):t(x.k)}</div>`)).join("");document.querySelectorAll(".chip").forEach(x=>x.onclick=()=>{if(mode==="careers"){region=x.dataset.k;buildTabs();load()}else{active=x.dataset.k;buildTabs();render()}})}
function updateIntro(){$("intro").textContent=t(mode==="news"?"introNews":mode==="business"?"introBusiness":"introCareers")}
function switchMode(m){mode=m;active="all";buildNav();buildTabs();updateIntro();if(!data[m].length)load();else render()}
const locale=()=>lang==="ar"?{hl:"ar",gl:"SA",ceid:"SA:ar"}:lang==="ur"?{hl:"ur",gl:"PK",ceid:"PK:ur"}:{hl:"en-PK",gl:"PK",ceid:"PK:en"};
function newsUrl(q){const l=locale();return `https://news.google.com/rss/search?q=${encodeURIComponent(q)}&hl=${l.hl}&gl=${l.gl}&ceid=${l.ceid}`}
function indeedUrl(r){return `https://${r.host}/rss?q=${encodeURIComponent(CAREER_Q)}&l=${encodeURIComponent(r.loc)}`}
function timeout(p,ms=12000){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms))])}
function clean(v){return (v||"").replace(/<[^>]+>/g,"").trim()}
async function rss2json(url){const r=await timeout(fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`));if(!r.ok)throw new Error();const j=await r.json();if(j.status!=="ok")throw new Error();return (j.items||[]).map(x=>({title:clean(x.title),link:x.link||"#",pubDate:x.pubDate,description:clean(x.description).slice(0,240)}))}
async function allorigins(url){const r=await timeout(fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`));if(!r.ok)throw new Error();const xml=new DOMParser().parseFromString(await r.text(),"text/xml");return [...xml.querySelectorAll("item")].map(x=>({title:clean(x.querySelector("title")?.textContent),link:x.querySelector("link")?.textContent||"#",pubDate:x.querySelector("pubDate")?.textContent||"",description:clean(x.querySelector("description")?.textContent).slice(0,240)}))}
async function fetchFeed(url){try{return await rss2json(url)}catch(e){try{return await allorigins(url)}catch(e2){failed++;return[]}}}
function validDate(item,days){const d=new Date(item.pubDate);if(Number.isNaN(d.getTime()))return false;return Date.now()-d.getTime()<=days*86400000&&d.getTime()<=Date.now()+86400000}
function dedupe(a){const s=new Set();return a.filter(x=>{const k=x.title.toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]/g,"").slice(0,70);if(!k||s.has(k))return false;s.add(k);return true})}
async function load(){failed=0;$("refresh").disabled=true;$("refresh").innerHTML=`<span class="spinner"></span>${t("refreshing")}`;$("status").textContent=t("loading");let out=[];
 if(mode==="news"||mode==="business"){const feeds=mode==="news"?NEWS:BUSINESS;const sets=await Promise.all(feeds.map(async f=>(await fetchFeed(newsUrl(f.q))).map(x=>({...x,k:f.k}))));out=sets.flat().filter(x=>validDate(x,3))}
 else{const r=REGIONS.find(x=>x.k===region);out=(await fetchFeed(indeedUrl(r))).filter(x=>validDate(x,60)).map(x=>({...x,k:"job"}))}
 data[mode]=dedupe(out).sort((a,b)=>new Date(b.pubDate)-new Date(a.pubDate));$("refresh").disabled=false;$("refresh").textContent=t("refresh");render()}
function publisher(title){const p=title.split(" - ");return p.length>1?p[p.length-1]:""}
function country(title){return ["Pakistan","Malaysia","Indonesia","Saudi Arabia","UAE","Bahrain","Kuwait","Qatar","Oman","Bangladesh","Türkiye","Turkey","Egypt","Nigeria","Iraq","Brunei","Ethiopia","Iran","Kenya","Uganda","Sri Lanka","UK","United Kingdom"].find(c=>title.toLowerCase().includes(c.toLowerCase()))||""}
function esc(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function render(){if(!I18N[lang])return;let items=data[mode]||[];if(mode!=="careers"&&active!=="all")items=items.filter(x=>x.k===active);const q=$("search").value.trim().toLowerCase();if(q)items=items.filter(x=>(x.title+" "+x.description).toLowerCase().includes(q));$("status").textContent=failed?t("partial")(items.length):t("loaded")(items.length);if(!items.length){$("grid").innerHTML=`<div class="empty">${t("empty")}</div>`;return}$("grid").innerHTML=items.slice(0,120).map(x=>{const c=country(x.title),d=new Date(x.pubDate).toLocaleDateString(lang==="ar"?"ar":lang==="ur"?"ur-PK":"en-PK",{day:"2-digit",month:"short",year:"numeric"});return `<article class="card"><div class="meta"><span class="badge">${esc(t(x.k))}</span>${c?`<span class="country">${esc(c)}</span>`:""}<span>${esc(d)}</span></div><a class="title" href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.title)}</a><div class="desc">${esc(x.description)}</div><div class="source">${esc(publisher(x.title)||x.source||"")}</div></article>`}).join("")}
$("refresh").onclick=load;$("search").oninput=render;$("language").onchange=e=>{lang=e.target.value;localStorage.setItem("ifnLang",lang);data={news:[],business:[],careers:[]};applyLanguage();load()};
applyLanguage();load();setInterval(load,30*60*1000);
</script>
</body>
</html>
