<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Islamic Finance & Shariah Compliance News Hub</title>
<style>
:root{--g:#0b5d3b;--d:#083f28;--gold:#c9a24b;--bg:#f5f6f4;--txt:#1c2a22;--muted:#5b6b62;--bd:#e2e6e0}*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt)}header{background:linear-gradient(135deg,var(--d),var(--g));color:#fff;padding:22px 28px}h1{margin:0;font-size:22px}header p{margin:6px 0 0;color:#dfeee6;font-size:13px}nav{display:flex;gap:8px;flex-wrap:wrap;background:var(--d);padding:0 28px}.mode{padding:12px 18px;color:#cfe4d8;font-weight:650;cursor:pointer;border-bottom:3px solid transparent}.mode.active{color:#fff;border-bottom-color:var(--gold)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;padding:14px 28px;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:4}.toolbar input{flex:1;min-width:210px;padding:9px 12px;border:1px solid var(--bd);border-radius:6px}.toolbar select,.toolbar button{padding:9px 13px;border:1px solid var(--bd);border-radius:6px;background:#fff}.toolbar button{background:var(--gold);border:0;font-weight:700;cursor:pointer}.toolbar button:disabled{opacity:.65}.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 28px 0}.chip{padding:7px 14px;border:1px solid var(--bd);border-radius:20px;background:#eef1ec;color:var(--muted);font-size:13px;cursor:pointer}.chip.active{background:var(--g);color:#fff;border-color:var(--g)}main{max-width:1200px;margin:auto;padding:18px 28px 40px}.intro,.status{color:var(--muted);font-size:13px}.status{font-size:12px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}.card:hover{box-shadow:0 4px 14px #00000014}.meta{display:flex;gap:5px;justify-content:space-between;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:11.5px}.badge,.country{padding:2px 9px;border-radius:12px;font-weight:700}.badge{background:#eaf3ee;color:var(--d)}.country{background:#f7efe0;color:#8a6d1f}.title{font-size:15px;line-height:1.35;font-weight:650;color:var(--txt);text-decoration:none}.title:hover{color:var(--g);text-decoration:underline}.desc{font-size:13px;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.source{font-size:12px;font-weight:700;color:#9a7629}.empty{text-align:center;color:var(--muted);padding:50px 10px}footer{max-width:1200px;margin:0 auto 35px;padding:15px 28px;border-top:1px solid var(--bd);font-size:11.5px;color:#7b857e;text-align:center;line-height:1.6}.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:s .8s linear infinite;margin-inline-end:6px;vertical-align:-2px}@keyframes s{to{transform:rotate(360deg)}}[dir=rtl] body{font-family:Tahoma,"Segoe UI",Arial,sans-serif}[dir=rtl] nav,[dir=rtl] .toolbar,[dir=rtl] .tabs{text-align:right}@media(max-width:600px){header,nav,.toolbar,.tabs,main{padding-left:16px;padding-right:16px}.mode{padding:10px 8px;font-size:13px}}
</style></head>
<body>
<header><h1 id="title"></h1><p id="subtitle"></p></header><nav id="nav"></nav>
<div class="toolbar"><input id="search"><select id="language"><option value="en">English</option><option value="ar">العربية</option><option value="ur">اردو</option></select><button id="refresh"></button></div>
<div class="tabs" id="tabs"></div><main><p class="intro" id="intro"></p><p class="status" id="status"></p><div class="grid" id="grid"></div></main><footer id="footer"></footer>
<script>
const T={
en:{title:"🕌 Islamic Finance & Shariah Compliance News Hub",sub:"Latest Islamic finance news, business opportunities and careers.",news:"📰 News",business:"🤝 Business Opportunities",careers:"💼 Careers",search:"Search headlines, jobs, or opportunities...",refresh:"⟳ Refresh",refreshing:"Refreshing...",all:"All",in1:"Islamic finance, Sukuk, Takaful and Shariah compliance news published within the last 10 days.",in2:"Business, trade, distribution and manufacturing opportunities published within the last 10 days.",in3:"Islamic banking, finance, Takaful and Shariah positions published within the last month. Please verify the application deadline at the original source.",loading:"Fetching current results...",loaded:(n,d)=>`${n} results · ${d}`,empty:"No current results were found for this selection.",foot:"This utility is provided for community benefit and non-commercial use. It aggregates public headlines and links to original sources. Accuracy and availability remain the responsibility of the original publishers. Created by Azf. Iqbal, through AI.",global:"Global",sukuk:"Sukuk",takaful:"Takaful",standards:"Shariah / Standards",contracts:"Contracts",pakistan:"Pakistan",gcc:"GCC",fintech:"Fintech",trade:"Trade & Export",distribution:"Distribution / FMCG",manufacturing:"Manufacturing",sme:"SME Financing",halal:"Halal Industry",policy:"Policy & Tenders",projects:"Project Financing",pk:"Pakistan",mideast:"Middle East / GCC",sea:"Southeast Asia",sa:"South Asia",uk:"UK & Europe",remote:"Global / Remote",job:"Open Position"},
ar:{title:"🕌 مركز أخبار التمويل الإسلامي والالتزام الشرعي",sub:"أحدث أخبار التمويل الإسلامي وفرص الأعمال والوظائف.",news:"📰 الأخبار",business:"🤝 فرص الأعمال",careers:"💼 الوظائف",search:"ابحث في الأخبار والوظائف والفرص...",refresh:"⟳ تحديث",refreshing:"جارٍ التحديث...",all:"الكل",in1:"أخبار التمويل الإسلامي والصكوك والتكافل والالتزام الشرعي المنشورة خلال آخر 10 أيام.",in2:"فرص الأعمال والتجارة والتوزيع والتصنيع المنشورة خلال آخر 10 أيام.",in3:"وظائف المصرفية والتمويل الإسلامي والتكافل والشريعة المنشورة خلال الشهر الماضي. يرجى التحقق من موعد إغلاق التقديم من المصدر الأصلي.",loading:"جارٍ جلب النتائج الحالية...",loaded:(n,d)=>`${n} نتيجة · ${d}`,empty:"لم يتم العثور على نتائج حالية لهذا الاختيار.",foot:"هذه الأداة مخصصة لخدمة المجتمع وللاستخدام غير التجاري. تجمع العناوين العامة وتربط بالمصادر الأصلية. تبقى الدقة والتوفر مسؤولية الناشرين الأصليين. أُنشئت بواسطة Azf. Iqbal باستخدام الذكاء الاصطناعي.",global:"عالمي",sukuk:"الصكوك",takaful:"التكافل",standards:"الشريعة / المعايير",contracts:"العقود",pakistan:"باكستان",gcc:"الخليج",fintech:"التقنية المالية",trade:"التجارة والتصدير",distribution:"التوزيع والسلع الاستهلاكية",manufacturing:"التصنيع",sme:"تمويل المنشآت",halal:"صناعة الحلال",policy:"السياسات والمناقصات",projects:"تمويل المشاريع",pk:"باكستان",mideast:"الشرق الأوسط / الخليج",sea:"جنوب شرق آسيا",sa:"جنوب آسيا",uk:"المملكة المتحدة وأوروبا",remote:"عالمي / عن بُعد",job:"وظيفة شاغرة"},
ur:{title:"🕌 اسلامی مالیات اور شرعی تعمیل نیوز ہب",sub:"اسلامی مالیات، کاروباری مواقع اور ملازمتوں کی تازہ معلومات۔",news:"📰 خبریں",business:"🤝 کاروباری مواقع",careers:"💼 ملازمتیں",search:"خبریں، ملازمتیں یا مواقع تلاش کریں...",refresh:"⟳ تازہ کریں",refreshing:"تازہ کیا جا رہا ہے...",all:"تمام",in1:"گزشتہ 10 دنوں میں شائع ہونے والی اسلامی مالیات، صکوک، تکافل اور شرعی تعمیل کی خبریں۔",in2:"گزشتہ 10 دنوں میں شائع ہونے والے کاروبار، تجارت، تقسیم اور مینوفیکچرنگ کے مواقع۔",in3:"گزشتہ ایک ماہ میں شائع ہونے والی اسلامی بینکاری، مالیات، تکافل اور شریعہ کی ملازمتیں۔ درخواست کی آخری تاریخ اصل ماخذ سے ضرور چیک کریں۔",loading:"موجودہ نتائج حاصل کیے جا رہے ہیں...",loaded:(n,d)=>`${n} نتائج · ${d}`,empty:"اس انتخاب کے لیے کوئی موجودہ نتیجہ نہیں ملا۔",foot:"یہ سہولت عوامی فائدے اور غیر تجارتی استعمال کے لیے ہے۔ یہ عوامی سرخیاں جمع کرتی اور اصل ماخذ سے منسلک کرتی ہے۔ درستگی اور دستیابی کی ذمہ داری اصل ناشرین پر ہے۔ یہ سہولت Azf. Iqbal نے AI کے ذریعے تیار کی ہے۔",global:"عالمی",sukuk:"صکوک",takaful:"تکافل",standards:"شریعہ / معیارات",contracts:"عقود",pakistan:"پاکستان",gcc:"خلیج",fintech:"فن ٹیک",trade:"تجارت و برآمدات",distribution:"تقسیم / ایف ایم سی جی",manufacturing:"مینوفیکچرنگ",sme:"ایس ایم ای فنانسنگ",halal:"حلال صنعت",policy:"پالیسی اور ٹینڈرز",projects:"پروجیکٹ فنانسنگ",pk:"پاکستان",mideast:"مشرق وسطیٰ / خلیج",sea:"جنوب مشرقی ایشیا",sa:"جنوبی ایشیا",uk:"برطانیہ و یورپ",remote:"عالمی / ریموٹ",job:"کھلی آسامی"}}
const NEWS=[{k:"global",q:'"Islamic finance" OR "Islamic banking"'},{k:"sukuk",q:'Sukuk'},{k:"takaful",q:'Takaful insurance'},{k:"standards",q:'"Shariah compliant" OR AAOIFI OR IFSB'},{k:"contracts",q:'Murabaha OR Ijarah OR Musharakah OR Mudarabah'},{k:"pakistan",q:'Pakistan ("Islamic banking" OR Shariah OR Sukuk OR "State Bank of Pakistan")'},{k:"gcc",q:'("Islamic bank" OR Sukuk) (UAE OR Saudi OR Qatar OR Bahrain OR Kuwait)'},{k:"fintech",q:'"Islamic fintech" OR "digital Islamic banking"'}];
const BUSINESS=[{k:"trade",q:'Pakistan (exports OR "trade finance" OR "export incentive" OR "free trade agreement")'},{k:"distribution",q:'Pakistan ("distribution agreement" OR FMCG OR "sales network" OR "distributor appointed")'},{k:"manufacturing",q:'Pakistan (manufacturing OR "industrial expansion" OR "new factory" OR "production facility")'},{k:"sme",q:'("Islamic trade finance" OR "SME financing" OR Murabaha) (Pakistan OR SME OR exporters)'},{k:"gcc",q:'(GCC OR UAE OR Saudi OR Qatar) ("business opportunity" OR "trade delegation" OR "investment opportunity" OR "franchise opportunity")'},{k:"halal",q:'("Halal certification" OR "Halal export" OR "Halal industry") (Pakistan OR global OR expansion)'},{k:"policy",q:'Pakistan ("import policy" OR "export policy" OR tender OR "trade tariff" OR SECP OR "State Bank of Pakistan")'},{k:"projects",q:'Sukuk ("project financing" OR infrastructure OR industrial OR manufacturer)'}];
const REGIONS=[{k:"pk",loc:"Pakistan"},{k:"mideast",loc:"UAE OR Saudi Arabia OR Qatar OR Bahrain OR Kuwait"},{k:"sea",loc:"Malaysia OR Indonesia OR Brunei"},{k:"sa",loc:"Bangladesh OR Sri Lanka OR India"},{k:"uk",loc:"United Kingdom OR Europe"},{k:"remote",loc:"remote OR global"}];
const CAREER='("Islamic banking" OR "Islamic finance" OR "Shariah compliance" OR Takaful OR Sukuk) (job OR vacancy OR hiring OR careers OR recruitment)';
let lang=localStorage.ifnLang||"en",mode="news",active="all",region="pk",cache={news:[],business:[],careers:{}},loaded={news:false,business:false,careers:{}},loadToken=0;
const $=x=>document.getElementById(x),tr=k=>T[lang][k]??k;
function sourceUrl(q){return `https://news.google.com/rss/search?q=${encodeURIComponent(q)}&hl=en-PK&gl=PK&ceid=PK:en`}
function timeout(p){return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error()),12000))])}
function clean(s){return (s||"").replace(/<[^>]+>/g,"").trim()}
async function get1(url){const r=await timeout(fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`));if(!r.ok)throw Error();const j=await r.json();if(j.status!=="ok")throw Error();return (j.items||[]).map(x=>({title:clean(x.title),link:x.link||"#",pubDate:x.pubDate,description:clean(x.description).slice(0,240)}))}
async function get2(url){const r=await timeout(fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`));if(!r.ok)throw Error();const x=new DOMParser().parseFromString(await r.text(),"text/xml");return [...x.querySelectorAll("item")].map(i=>({title:clean(i.querySelector("title")?.textContent),link:i.querySelector("link")?.textContent||"#",pubDate:i.querySelector("pubDate")?.textContent||"",description:clean(i.querySelector("description")?.textContent).slice(0,240)}))}
async function feed(url){try{return await get1(url)}catch{try{return await get2(url)}catch{return[]}}}
function recent(x,days){const d=new Date(x.pubDate);return !isNaN(d)&&d<=new Date(Date.now()+86400000)&&Date.now()-d<=days*86400000}
function unique(a){const s=new Set();return a.filter(x=>{const k=x.title.toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]/g,"").slice(0,70);if(!k||s.has(k))return false;s.add(k);return true}).sort((a,b)=>new Date(b.pubDate)-new Date(a.pubDate))}
function current(){return mode==="careers"?(cache.careers[region]||[]):cache[mode]}
function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==="en"?"ltr":"rtl";$("title").textContent=tr("title");$("subtitle").textContent=tr("sub");$("search").placeholder=tr("search");$("refresh").textContent=tr("refresh");$("footer").textContent=tr("foot");$("language").value=lang;buildNav();buildTabs();intro();render()}
function buildNav(){$("nav").innerHTML=["news","business","careers"].map(k=>`<div class="mode ${mode===k?"active":""}" data-k="${k}">${tr(k)}</div>`).join("");document.querySelectorAll(".mode").forEach(x=>x.onclick=()=>switchMode(x.dataset.k))}
function buildTabs(){const a=mode==="news"?NEWS:mode==="business"?BUSINESS:REGIONS;$("tabs").innerHTML=(mode==="careers"?a.map(x=>`<div class="chip ${region===x.k?"active":""}" data-k="${x.k}">${tr(x.k)}</div>`):[{k:"all"},...a].map(x=>`<div class="chip ${active===x.k?"active":""}" data-k="${x.k}">${x.k==="all"?tr("all"):tr(x.k)}</div>`)).join("");document.querySelectorAll(".chip").forEach(x=>x.onclick=()=>{if(mode==="careers"){region=x.dataset.k;buildTabs();if(!loaded.careers[region])load();else render()}else{active=x.dataset.k;buildTabs();render()}})}
function intro(){$("intro").textContent=tr(mode==="news"?"in1":mode==="business"?"in2":"in3")}
function switchMode(m){mode=m;active="all";buildNav();buildTabs();intro();render();const ready=m==="careers"?loaded.careers[region]:loaded[m];if(!ready)load()}
async function load(){const token=++loadToken,myMode=mode,myRegion=region;$("refresh").disabled=true;$("refresh").innerHTML=`<span class="spin"></span>${tr("refreshing")}`;$("status").textContent=tr("loading");let out=[];
 if(myMode==="news"||myMode==="business"){const defs=myMode==="news"?NEWS:BUSINESS;const sets=await Promise.all(defs.map(async f=>(await feed(sourceUrl(`${f.q} when:10d`))).map(x=>({...x,k:f.k}))));out=unique(sets.flat().filter(x=>recent(x,10)));cache[myMode]=out;loaded[myMode]=true}
 else{const r=REGIONS.find(x=>x.k===myRegion);out=unique((await feed(sourceUrl(`${CAREER} (${r.loc}) when:30d`))).filter(x=>recent(x,30)).map(x=>({...x,k:"job"})));cache.careers[myRegion]=out;loaded.careers[myRegion]=true}
 if(token===loadToken){$("refresh").disabled=false;$("refresh").textContent=tr("refresh");render()}}
function esc(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function pub(s){const p=s.split(" - ");return p.length>1?p.pop():""}function ctry(s){return ["Pakistan","Malaysia","Indonesia","Saudi Arabia","UAE","Bahrain","Kuwait","Qatar","Oman","Bangladesh","Turkey","Egypt","Nigeria","Iraq","Brunei","Kenya","Uganda","Sri Lanka","UK","United Kingdom"].find(c=>s.toLowerCase().includes(c.toLowerCase()))||""}
function render(){let a=current();if(mode!=="careers"&&active!=="all")a=a.filter(x=>x.k===active);const q=$("search").value.trim().toLowerCase();if(q)a=a.filter(x=>(x.title+" "+x.description).toLowerCase().includes(q));$("status").textContent=tr("loaded")(a.length,new Date().toLocaleString(lang==="ar"?"ar":lang==="ur"?"ur-PK":"en-PK"));if(!a.length){$("grid").innerHTML=`<div class="empty">${tr("empty")}</div>`;return}$("grid").innerHTML=a.map(x=>{const c=ctry(x.title),d=new Date(x.pubDate).toLocaleDateString(lang==="ar"?"ar":lang==="ur"?"ur-PK":"en-PK",{day:"2-digit",month:"short",year:"numeric"});return `<article class="card"><div class="meta"><span class="badge">${esc(tr(x.k))}</span>${c?`<span class="country">${esc(c)}</span>`:""}<span>${esc(d)}</span></div><a class="title" href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.title)}</a><div class="desc">${esc(x.description)}</div><div class="source">${esc(pub(x.title))}</div></article>`}).join("")}
$("refresh").onclick=load;$("search").oninput=render;$("language").onchange=e=>{lang=e.target.value;localStorage.ifnLang=lang;applyLang()};applyLang();load();setInterval(load,30*60*1000);
</script></body></html>
